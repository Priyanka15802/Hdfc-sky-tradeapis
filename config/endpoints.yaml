# Single source of truth for every HDFC Sky Open API endpoint this project
# calls. Nothing here is a secret, so this file IS committed to git.
#
# IMPORTANT: this environment could not reach developer.hdfcsky.com (network
# egress to HDFC's domains is blocked in this sandbox), so the exact method
# and path for each endpoint below are PLACEHOLDERS. Before flipping
# DRY_RUN=false in your .env, log into https://developer.hdfcsky.com,
# open the Open API reference, and replace every "TODO" with the real
# method/path/payload shape documented there.
#
# The client code (hdfc_sky/auth.py, hdfc_sky/orders.py) never hardcodes a
# URL — it always reads from here, so fixing an endpoint only ever means
# editing one line in this file.

base_url: "https://api.hdfcsky.com"  # TODO: confirm exact base URL

auth:
  # HDFC Sky's login is a 6-call flow. Rename these keys to match whatever
  # HDFC calls each step in their docs if it differs from this guess.
  step_1_generate_auth_code:
    method: GET
    path: /oapi/v1/login
    description: "TODO: build the hosted login URL (api_key + redirect_uri)"
  step_2_submit_credentials:
    method: POST
    path: /oapi/v1/login/credentials   # TODO
    description: "TODO: submit client id + password"
  step_3_request_otp:
    method: POST
    path: /oapi/v1/login/otp/generate   # TODO
    description: "TODO: trigger OTP/TOTP challenge"
  step_4_verify_otp:
    method: POST
    path: /oapi/v1/login/otp/verify   # TODO
    description: "TODO: verify OTP/TOTP, returns a request_token/auth_code"
  step_5_generate_session_token:
    method: POST
    path: /oapi/v1/session/token   # TODO
    description: "TODO: exchange request_token (+ checksum) for access_token"
  step_6_invalidate_session:
    method: DELETE
    path: /oapi/v1/session/token   # TODO
    description: "TODO: logout / invalidate the access token"

